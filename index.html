<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <base href="./">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,minimal-ui">
  <meta name="theme-color" content="#f95240">
  <title>타워 쌓기 - 토스 미니게임</title>
  <link rel="icon" type="image/x-icon" href="./assets/favicon-Cavh6cUP.png">
  <link rel="stylesheet" href="./mobile-layout.css">
  <style>
    @font-face {
      font-family: 'Black Han Sans';
      src: url('./assets/BlackHanSans-Regular-XAxCrE-R.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'wenxue';
      src: url('./assets/wenxue-BRU_-e2p.woff') format('woff'),
           url('./assets/wenxue-CHof2flc.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    * { margin: 0; padding: 0; }
    img { width: 100%; }
    html { background: #fff; height: 100%; }
    body {
      font-family: 'Black Han Sans', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif;
      margin: 0 auto; text-align: center;
      width: 100%; height: 100%;
      background: #f95240 url(./assets/main-bg-4moCKXOc.png);
      overflow: hidden;
    }
    html { font-size: 17.6vh; }
    /* Adjusted bottom to 80px to make room for banner ad */
    #canvas { position: fixed; left: 0; top: 0; right: 0; bottom: 80px; margin: auto; }
    a { text-decoration: none; }
    li, ol, ul { list-style-type: none; padding: 0; margin: 0; }
    .hide { display: none !important; }

    .loading { background-color: #f05a50; height: 100%; width: 100%; }
    .loading .main { width: 60%; margin: 0 auto; color: #fff; }
    .loading .main img { width: 60%; margin: 1rem auto 0; }
    .loading .main .title { font-size: .3rem; }
    .loading .main .text { font-size: .15rem; }
    .loading .main .bar { height: .12rem; width: 100%; border: 3px solid #fff; border-radius: .6rem; margin: .1rem 0; }
    .loading .main .bar .sub { height: .1rem; width: 98%; margin: .008rem auto 0; }
    .loading .main .bar .percent { height: 100%; width: 0; background-color: #fff; border-radius: .6rem; }
    .loading .logo { position: absolute; bottom: .3rem; left: 0; right: 0; }
    .loading .logo img { width: 1rem; }

    /* Adjusted content height to not overlap with bottom banner */
    .content { height: calc(100vh - 80px); max-width: 480px; margin: 0 auto; position: relative; }
    .landing .title { width: 60%; }
    .landing .action-2 { position: absolute; bottom: .2rem; width: 100%; }
    .landing .start { width: 65%; }

    .modal .mask { background-color: #000; opacity: .6; position: fixed; height: 100%; width: 100%; top: 0; left: 0; }
    .modal .modal-content { position: fixed; height: 100%; width: 90%; max-width: 480px; left: 50%; transform: translateX(-50%); margin-top: .3rem; top: 0; }
    .modal .main { width: 85%; margin: 0 auto; }
    .modal .container { position: relative; }
    .modal .bg { width: 100%; position: absolute; top: 0; left: 0; }
    .modal .modal-main { width: 100%; position: absolute; top: 0; left: 0; margin-top: -.4rem; }
    .modal .over-img { width: 80%; margin: .8rem auto 0; }
    .modal .over-score { margin-top: -.2rem; font-size: .5rem; color: #ff735c; text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff; }
    .modal .tip { font-size: .16rem; color: #9b724e; }
    .modal .over-button-b { width: 70%; margin: .1rem auto 0; }

    /* Korean localized text styles */
    .ko-title {
      font-family: 'Black Han Sans', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif;
      font-size: .45rem;
      color: #fff;
      text-shadow: 3px 3px 0 #d4442e, -1px -1px 0 #d4442e, 1px -1px 0 #d4442e, -1px 1px 0 #d4442e;
      letter-spacing: 0.05em;
      line-height: 1.2;
      padding: .3rem 0;
      width: 80%;
      margin: 0 auto;
    }
    .ko-btn {
      display: inline-block;
      font-family: 'Black Han Sans', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif;
      font-size: .22rem;
      color: #fff;
      background: linear-gradient(180deg, #ff8a65 0%, #f4511e 100%);
      border: 3px solid #fff;
      border-radius: .6rem;
      padding: .08rem .4rem;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.1s;
      margin: .05rem 0;
    }
    .ko-btn:active { transform: scale(0.95); }
    .ko-btn.action-grid__primary { display: block; width: 80%; margin: .05rem auto; }
    
    #rewarded-retry {
      background: linear-gradient(180deg, #4caf50 0%, #2e7d32 100%);
      font-size: .18rem;
    }

    .ko-game-over {
      font-family: 'Black Han Sans', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif;
      font-size: .32rem;
      color: #ff735c;
      text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff;
      margin: .6rem auto .1rem;
    }

    .swing {
      animation: sw 2s ease-in-out alternate infinite;
    }
    @keyframes sw {
      0% { transform: rotate(5deg); transform-origin: top center; }
      100% { transform: rotate(-5deg); transform-origin: top center; }
    }

    /* Ad placeholders */
    .ad-placeholder {
      width: 100%;
      height: 80px;
    }
    .bottom-banner-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 80px;
      z-index: 9999;
      background-color: #e0e0e0;
    }
    .gameover-image-ad {
      width: 80%;
      height: 60px;
      margin: 10px auto;
      border-radius: 8px;
    }
  </style>

  <!-- Toss Ads Abstraction Layer -->
  <script src="./toss-ads.js"></script>

  <script>
    // Initialize heart economy from sessionStorage
    const storedHearts = sessionStorage.getItem('currentStartHearts');
    window.currentStartHearts = storedHearts ? parseInt(storedHearts, 10) : 1;
    // Clear it so it defaults to 1 for the next session unless explicitly rewarded again
    sessionStorage.removeItem('currentStartHearts');
  </script>

  <!-- Toss SDK bridge: exposes window.TossFramework from @apps-in-toss/web-framework -->
  <script src="./toss-bridge.js"></script>
  <script type="module" crossorigin src="./assets/index-CRgUAfRE.js"></script>
</head>
<body>
  <canvas id="canvas" class="hide"></canvas>
  <div class="content base-layout">
    <div class="loading">
      <div class="main">
        <img src="./assets/main-loading-CPKvSDCZ.gif">
        <div class="progress">
          <div class="title">0%</div>
          <div class="bar"><div class="sub"><div class="percent"></div></div></div>
          <div class="text">로딩 중...</div>
        </div>
      </div>
    </div>
    <div class="landing hide">
      <div class="action-1">
        <div class="ko-title swing">타워<br>쌓기</div>
      </div>
      <div class="action-2">
        <div id="start" class="ko-btn action-grid__primary">시작</div>
      </div>
    </div>
    <a href="./credits.html" style="position:fixed;bottom:88px;right:10px;z-index:9998;font-size:10px;color:rgba(255,255,255,0.5);text-decoration:none;background:rgba(0,0,0,0.2);padding:3px 7px;border-radius:10px;">오픈소스</a>
    
    <div id="modal" class="modal hide">
      <div class="mask"></div>
      <div class="js-modal-content modal-content">
        <div class="main">
          <div class="container">
            <img src="./assets/main-modal-bg-Vj09WdUN.png" class="bg">
            <div class="modal-main">
              <div id="over-modal" class="hide js-modal-card">
                <div class="ko-game-over">게임 오버</div>
                <div id="score" class="over-score"></div>
                <div id="over-zero" class="hide">
                  <div class="tip">
                    <div class="ko-btn id-retry-interstitial action-grid__primary">다시하기</div>
                    <div class="ko-btn id-retry-rewarded action-grid__primary" id="rewarded-retry">광고 보고 하트 3개 받기</div>
                  </div>
                  <!-- Game Over Lower Image Ad -->
                  <div id="gameover_bottom_image_ad" class="ad-placeholder gameover-image-ad"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Global Bottom Banner Ad Area -->
  <div id="global_bottom_banner" class="bottom-banner-container"></div>

  <script>
    // Adjust canvas height to not overlap with the bottom banner
    window.TossAds.renderOrReserveBannerAd('global_bottom_banner', 'home_and_ingame_bottom_banner');
    window.TossAds.renderOrReserveBannerAd('gameover_bottom_image_ad', 'gameover_bottom_image_ad');

    // Override the setGameFailed logic from the bundled script
    // We attach to the native JS load event to override any globals
    window.addEventListener('load', () => {
      if (window.TowerGame) {
        // Find setGameFailed logic. It was hardcoded in the HTML previously, so we'll re-bind it.
        // Actually, setGameFailed is passed into TowerGame initialization in index-*.js.
        // Since we cannot easily override it after init, we update the logic in the minified bundle directly.
      }
    });

    // Handle Interstitial Retry Hook
    document.querySelectorAll('.id-retry-interstitial').forEach(btn => {
      btn.addEventListener('click', async () => {
        const success = await window.TossAds.showInterstitialAd('game_over_retry_interstitial');
        if (success) {
          const e = new URL(window.location.href);
          e.searchParams.set("s", Date.now());
          window.location.href = e.toString();
        }
      });
    });

    // Handle Rewarded Ad Hearts Hook
    document.querySelectorAll('.id-retry-rewarded').forEach(btn => {
      btn.addEventListener('click', async () => {
        const success = await window.TossAds.showRewardedAd('game_over_rewarded_hearts');
        if (success) {
          // Grant 3 hearts for the next attempt
          sessionStorage.setItem('currentStartHearts', 3);
          const e = new URL(window.location.href);
          e.searchParams.set("s", Date.now());
          window.location.href = e.toString();
        }
      });
    });
  </script>
</body>
</html>
